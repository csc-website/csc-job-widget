name: Update CSC Jobs

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update jobs.json
        run: python update-jobs.py

      - name: Commit updated jobs and logo cache
        run: |
          git config user.name "CSC Job Widget"
          git config user.email "actions@users.noreply.github.com"
          git add jobs.json logo_domains.json
          git diff --cached --quiet || git commit -m "Update CSC job listings"
          git push
